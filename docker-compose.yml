services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      provenance: false
      sbom: false
    image: risk-backend:latest
    environment:
      ARTIFACTS_DIR: /app/riskml/artifacts
      DEMO_DATA: /app/data/student-por.csv
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_ROWS: ${MAX_ROWS:-20000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks: [risk]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      provenance: false
      sbom: false
    image: risk-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    networks: [risk]

networks:
  risk:
    driver: bridge
